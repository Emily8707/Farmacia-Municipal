<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Farmacia Municipal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <!-- Lado Izquierdo (Azul) -->
    <div class="login-left">
        <img src="img/escudo.png" alt="Escudo Municipal">
        <h1>Municipalidad de<br>San Juan Sacatepéquez</h1>
        <h2>Farmacia Municipal</h2>
        <p>Sistema de Control de Inventario</p>
    </div>

    <!-- Lado Derecho (Formulario) -->
    <div class="login-right">
        <div class="login-card">
            
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 55px; height: 55px; background: #eef2ff; border-radius: 12px;">
                    <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 24px; color: var(--accent-blue);"></i>
                </div>
            </div>
            
            <h2>Iniciar sesión</h2>
            <p>Ingrese sus credenciales para continuar</p>

            <button type="button" class="btn-google" onclick="loginConGoogle()">
                <img src="https://img.icons8.com/color/18/000000/google-logo.png" alt="Google"> Continuar con Google
            </button>
            
            <div class="divider">O</div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@farmacia.gob.gt" value="admin@farmacia.gob.gt">
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label>Contraseña</label>
                        <a href="#">¿Olvidó su contraseña?</a>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="admin123" value="admin123">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <div class="create-account">
                ¿No tiene una cuenta? <a href="registro.html">Crear cuenta</a>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // LOGIN CON CORREO Y CONTRASEÑA
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert('Por favor ingrese su correo.');
                return;
            }
            
            // Guardar el correo real que escribió el usuario
            localStorage.setItem('usuarioLogueado', email);
            window.location.href = 'dashboard.html';
        });

        // ============================================================
        // LOGIN CON GOOGLE
        // ============================================================
        function loginConGoogle() {
            // Usamos un correo genérico para el modo Google
            localStorage.setItem('usuarioLogueado', 'admin@farmacia.gob.gt');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
