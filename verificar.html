<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Correo - Farmacia Municipal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <!-- Lado Izquierdo (Azul) -->
    <div class="login-left">
        <img src="img/escudo.png" alt="Escudo Municipal">
        <h1>Municipalidad de<br>San Juan Sacatepéquez</h1>
        <h2>Farmacia Municipal</h2>
        <p>Sistema de Control de Inventario</p>
    </div>

    <!-- Lado Derecho (Verificación) -->
    <div class="login-right">
        <div class="login-card">
            
            <!-- Icono superior -->
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 55px; height: 55px; background: #eef2ff; border-radius: 12px;">
                    <i class="fa-regular fa-envelope" style="font-size: 24px; color: var(--accent-blue);"></i>
                </div>
            </div>
            
            <h2>Verify your email</h2>
            <p class="verify-subtitle">We sent a code to <strong id="emailMostrado">correo@ejemplo.com</strong></p>

            <form id="verifyForm">
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric">
                </div>

                <button type="submit" class="btn-verify">Verify</button>
            </form>

            <div class="resend-text">
                Didn't receive the code? <a href="#" id="btnResend">Resend</a>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // MOSTRAR EL CORREO GUARDADO
        // ============================================================
        const emailGuardado = localStorage.getItem('tempEmail') || 'correo@ejemplo.com';
        document.getElementById('emailMostrado').textContent = emailGuardado;

        // ============================================================
        // AUTO-FOCUS ENTRE LOS INPUTS DEL CÓDIGO
        // ============================================================
        const inputs = document.querySelectorAll('.code-input');
        inputs.forEach((input, index) => {
            // Auto-avanzar al siguiente
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Retroceder con backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Solo permitir números
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });

            // Permitir pegar el código completo
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 6);
                if (/^\d+$/.test(pasteData)) {
                    pasteData.split('').forEach((char, i) => {
                        if (inputs[i]) inputs[i].value = char;
                    });
                    inputs[Math.min(pasteData.length, 5)].focus();
                }
            });
        });

        // ============================================================
        // VERIFICAR CÓDIGO (SIMULADO)
        // ============================================================
        document.getElementById('verifyForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const codigo = Array.from(inputs).map(i => i.value).join('');

            if (codigo.length !== 6) {
                alert('Por favor ingrese los 6 dígitos del código.');
                return;
            }

            // Simulación - cualquier código es válido en prototipo
            localStorage.setItem('usuarioLogueado', emailGuardado);
            
            // Limpiar datos temporales
            localStorage.removeItem('tempEmail');
            localStorage.removeItem('tempPassword');

            alert('✅ Cuenta verificada exitosamente.\n\nSerá redirigido al sistema.');
            window.location.href = 'dashboard.html';
        });

        // ============================================================
        // REENVIAR CÓDIGO
        // ============================================================
        document.getElementById('btnResend').addEventListener('click', (e) => {
            e.preventDefault();
            alert(`📧 Se ha reenviado el código a:\n\n${emailGuardado}\n\n(Simulación - prototipo)`);
        });
    </script>
</body>
</html>
