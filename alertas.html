<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas de Vencimiento - Farmacia Municipal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="page-header-alertas">
                <div>
                    <h1 class="header-alertas-title">
                        <i class="fa-solid fa-triangle-exclamation" style="color: #e74c3c;"></i>
                        Alertas de vencimiento
                    </h1>
                    <p class="subtitle">Medicamentos clasificados por urgencia de vencimiento</p>
                </div>
                <button class="btn-export" onclick="exportarAlertas()">
                    <i class="fa-solid fa-download"></i> Exportar alertas
                </button>
            </header>
            <div id="contenedorAlertas"></div>
        </main>
    </div>
    <script src="js/layout.js"></script>
    <script src="js/alertas.js"></script>
</body>
</html>
