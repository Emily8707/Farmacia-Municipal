<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Movimientos - Farmacia Municipal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar-container"></aside>
        <main class="main-content">
            <header class="page-header-simple">
                <h1 class="header-with-icon">
                    <i class="fa-solid fa-arrows-rotate" style="color: #0040C2;"></i>
                    Consulta de movimientos
                </h1>
                <p class="subtitle">Historial de entradas y salidas del inventario</p>
            </header>
            <div class="filtros-card">
                <div class="filtros-grid">
                    <div class="filtro-item">
                        <label>Tipo</label>
                        <select id="filtroTipo">
                            <option value="todos">Todos</option>
                            <option value="Entrada">Entradas</option>
                            <option value="Salida">Salidas</option>
                        </select>
                    </div>
                    <div class="filtro-item">
                        <label>Medicamento</label>
                        <input type="text" id="filtroMedicamento" placeholder="Nombre...">
                    </div>
                    <div class="filtro-item">
                        <label>Desde</label>
                        <input type="date" id="filtroDesde">
                    </div>
                    <div class="filtro-item">
                        <label>Hasta</label>
                        <input type="date" id="filtroHasta">
                    </div>
                </div>
            </div>
            <div class="table-container">
                <table class="movimientos-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Medicamento</th>
                            <th>Lote</th>
                            <th>Cantidad</th>
                            <th>Paciente / Proveedor</th>
                            <th>Receta</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMovimientos"></tbody>
                </table>
                <div class="table-footer">
                    <div class="pagination-info">
                        Mostrando <strong id="infoRango">0</strong> de <strong id="infoTotal">0</strong> movimientos
                    </div>
                    <div class="pagination-controls">
                        <button class="btn-page" id="btnPrev" onclick="cambiarPagina(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="page-indicator"><strong id="paginaActual">1</strong> / <span id="paginaTotal">1</span></span>
                        <button class="btn-page" id="btnNext" onclick="cambiarPagina(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/layout.js"></script>
    <script src="js/movimientos.js"></script>
</body>
</html>
